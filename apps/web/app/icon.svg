<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e599" />
      <stop offset="100%" stop-color="#00cc88" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#09090b" />
  <rect width="512" height="512" rx="128" fill="url(#primaryGradient)" opacity="0.1" />
  
  <!-- Outer border glow -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="none" stroke="url(#primaryGradient)" stroke-width="8" opacity="0.3" filter="url(#glow)" />
  
  <!-- Bitswitch Icon representation (Flag-like or switch-like) -->
  <g transform="translate(128, 128)" filter="url(#glow)">
    <!-- Main stem -->
    <rect x="40" y="20" width="32" height="216" rx="16" fill="url(#primaryGradient)" />
    <!-- Top flag -->
    <path d="M 72 40 L 220 40 C 235 40 245 55 240 68 L 220 100 L 240 132 C 245 145 235 160 220 160 L 72 160 Z" fill="url(#primaryGradient)" />
  </g>
</svg>
