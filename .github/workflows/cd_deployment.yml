name: deploy to production

on:
  push:
    branches: [main]

jobs:
  redeploy_monorepo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SECRET }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 93.127.185.146 >> ~/.ssh/known_hosts

      - name: SSH into server and deploy
        run: |
          set -e
          ssh \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=5 \
            -i ~/.ssh/id_rsa \
            deploy@93.127.185.146 << 'EOF'
            set -euo pipefail

            # Load environment
            source ~/.bashrc
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use 22

            export PNPM_HOME="/home/deploy/.local/share/pnpm"
            export PATH="$PNPM_HOME:$PATH"

            cd /home/deploy/app/feature-flags || exit 1

            echo "Pulling latest changes..."
            git fetch origin main
            git pull origin main

            echo "Installing dependencies..."
            pnpm install

            echo "Generating Prisma Client..."
            cd packages/db && pnpm prisma generate && cd -

            echo "Building Monorepo (via Turborepo)..."
            # Turborepo will automatically detect what changed and only build those apps
            pnpm build

            echo "Starting/Reloading PM2..."
            # Starts apps if they aren't running, gracefully reloads them if they are
            pm2 start ecosystem.config.js
            pm2 reload ecosystem.config.js --env production
            pm2 save

            echo "Deployment Completed"
          EOF
